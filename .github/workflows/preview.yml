name: Preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build preview
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: agenda_contabil
          POSTGRES_USER: agenda
          POSTGRES_PASSWORD: agenda
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U agenda"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      APP_ENV: local
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: agenda_contabil
      DB_USERNAME: agenda
      DB_PASSWORD: agenda

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, pgsql, mbstring, intl, bcmath
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: |
          composer install --prefer-dist --no-interaction --no-progress
          npm ci

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Build assets for the Pages address
        run: npm run build
        env:
          ASSET_URL: ${{ steps.pages.outputs.base_url }}

      - name: Seed demo data
        run: php artisan migrate --seed --force

      - name: Export static preview
        run: php artisan preview:export "${{ steps.pages.outputs.base_url }}"

      - name: Add mobile app
        run: |
          npm --prefix mobile run build:demo
          mkdir -p build/preview/app
          cp -R mobile/dist/. build/preview/app/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/preview

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
